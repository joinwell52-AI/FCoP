<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">并行任务，明确汇合证据</title>
  <desc id="desc">同一 Root 下两个同级分支各自执行、交付并接受授权审查。Root 归档时检查当前报告、摘要、汇合及独立归档授权；这不是代码合并。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#506781" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="390" rx="20" fill="#f2f6fa"/>
  <g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Arial,sans-serif" fill="#152b43">
    <text x="30" y="45" font-size="28" font-weight="700">多条有序工作流，形成可收尾的并行。</text>
    <rect x="26" y="133" width="155" height="117" rx="12" fill="#152b43"/>
    <text x="103" y="178" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">主任务 Root</text>
    <text x="103" y="218" text-anchor="middle" font-size="18" fill="#ccdbe9">共同目标</text>
    <path d="M183 178H207V133H237" fill="none" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M183 208H207V245H237" fill="none" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="251" y="90" width="414" height="87" rx="10" fill="#e4edff" stroke="#c3d5f0"/>
    <text x="271" y="124" font-size="22" font-weight="700" fill="#214d94">分支任务 A</text>
    <text x="271" y="154" font-size="20">执行 → 交付 → 审查 → 完成</text>
    <rect x="251" y="202" width="414" height="87" rx="10" fill="#e4f3ee" stroke="#b9ddcf"/>
    <text x="271" y="236" font-size="22" font-weight="700" fill="#176448">分支任务 B</text>
    <text x="271" y="266" font-size="20">执行 → 交付 → 审查 → 完成</text>
    <path d="M667 133H690V178H713" fill="none" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M667 245H690V208H713" fill="none" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="727" y="90" width="209" height="199" rx="12" fill="#fff" stroke="#a9bfd3"/>
    <text x="745" y="125" font-size="22" font-weight="700">主任务收尾</text>
    <text x="745" y="165" font-size="19">当前交付证据</text>
    <text x="745" y="198" font-size="19">明确汇合记录</text>
    <text x="745" y="231" font-size="19">独立归档授权</text>
    <text x="745" y="268" font-size="17" fill="#506781">提交时重新检查</text>
    <text x="30" y="338" font-size="20">每个 Branch 都是通过 branch_of 关联的 TASK，宿主安排执行。</text>
    <text x="30" y="368" font-size="18" fill="#506781">证据汇合不代替 Git 合并，也不负责让 Agent 持续运行。</text>
  </g>
</svg>
