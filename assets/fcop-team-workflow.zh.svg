<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">ADMIN 定目标，PM 带团队，报告回到 PM。</title>
  <desc id="desc">ADMIN 向 PM 提出需求；PM 拆解任务并派给 DEV、QA、OPS；成员向 PM 回报；PM 汇总报告给 ADMIN。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b86" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="420" rx="24" fill="#f1f6fb"/>
  <g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#153047">
    <text x="28" y="44" font-size="26" font-weight="700">ADMIN 定目标，PM 带团队，报告回到 PM。</text>
    <text x="28" y="76" font-size="17" fill="#526b86">多 Agent 团队协作 · 文件即协议 · 无需复杂基础设施</text>
    <rect x="28" y="128" width="170" height="180" rx="16" fill="#153047"/>
    <text x="113" y="183" text-anchor="middle" font-size="27" font-weight="700" fill="white">ADMIN</text>
    <text x="113" y="220" text-anchor="middle" font-size="19" fill="white">真人 · 提出需求</text>
    <text x="113" y="256" text-anchor="middle" font-size="18" fill="white">对接 PM</text>
    <rect x="356" y="128" width="232" height="180" rx="16" fill="#e3edff" stroke="#c3d5f5"/>
    <text x="472" y="174" text-anchor="middle" font-size="28" font-weight="700">PM</text>
    <text x="472" y="211" text-anchor="middle" font-size="19">拆解任务 · 分派团队</text>
    <text x="472" y="244" text-anchor="middle" font-size="19">跟进交付 · 汇总报告</text>
    <text x="472" y="278" text-anchor="middle" font-size="17" fill="#526b86">ADMIN 的统一对接人</text>
    <rect x="756" y="112" width="176" height="212" rx="16" fill="#e3f3ed" stroke="#bdded1"/>
    <text x="844" y="149" text-anchor="middle" font-size="23" font-weight="700">Agent 团队</text>
    <text x="844" y="190" text-anchor="middle" font-size="20">DEV · 开发</text>
    <text x="844" y="230" text-anchor="middle" font-size="20">QA · 测试</text>
    <text x="844" y="270" text-anchor="middle" font-size="20">OPS · 运维</text>
    <text x="844" y="303" text-anchor="middle" font-size="16" fill="#526b86">各自执行，向 PM 回报</text>
    <g fill="none" stroke="#526b86" stroke-width="2" marker-end="url(#arrow)">
      <path d="M204 181 H348"/><path d="M348 260 H204"/>
      <path d="M596 181 H748"/><path d="M748 260 H596"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="276" y="167">需求 / 任务</text>
      <text x="276" y="287">PM 汇总报告</text>
      <text x="672" y="167">PM 分派 TASK</text>
      <text x="672" y="287">成员提交 REPORT</text>
    </g>
    <text x="28" y="365" font-size="19">ADMIN 与 PM 沟通；Agent 之间以 TASK / REPORT 等文件协作。</text>
    <text x="28" y="397" font-size="16" fill="#526b86">团队示例：角色与路由由 Team/Profile 定义；FCoP Core 不内置组织架构。</text>
  </g>
</svg>
