<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">ADMIN sets the goal. PM leads the team.</title>
  <desc id="desc">ADMIN briefs PM. PM decomposes and assigns tasks to DEV, QA and OPS. Members report to PM; PM summarizes for ADMIN.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b86" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="420" rx="24" fill="#f1f6fb"/>
  <g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#153047">
    <text x="28" y="44" font-size="26" font-weight="700">ADMIN sets the goal. PM leads the team.</text>
    <text x="28" y="76" font-size="17" fill="#526b86">Multi-agent teamwork · Files as protocol · No complex infrastructure</text>
    <rect x="28" y="128" width="170" height="180" rx="16" fill="#153047"/>
    <text x="113" y="183" text-anchor="middle" font-size="27" font-weight="700" fill="white">ADMIN</text>
    <text x="113" y="220" text-anchor="middle" font-size="19" fill="white">Human · Goals</text>
    <text x="113" y="256" text-anchor="middle" font-size="18" fill="white">Works with PM</text>
    <rect x="356" y="128" width="232" height="180" rx="16" fill="#e3edff" stroke="#c3d5f5"/>
    <text x="472" y="174" text-anchor="middle" font-size="28" font-weight="700">PM</text>
    <text x="472" y="211" text-anchor="middle" font-size="19">Decompose · Assign</text>
    <text x="472" y="244" text-anchor="middle" font-size="19">Track · Summarize</text>
    <text x="472" y="278" text-anchor="middle" font-size="17" fill="#526b86">ADMIN’s point of contact</text>
    <rect x="756" y="112" width="176" height="212" rx="16" fill="#e3f3ed" stroke="#bdded1"/>
    <text x="844" y="149" text-anchor="middle" font-size="23" font-weight="700">Agent team</text>
    <text x="844" y="190" text-anchor="middle" font-size="20">DEV · Build</text>
    <text x="844" y="230" text-anchor="middle" font-size="20">QA · Test</text>
    <text x="844" y="270" text-anchor="middle" font-size="20">OPS · Ops</text>
    <text x="844" y="303" text-anchor="middle" font-size="16" fill="#526b86">Execute; report to PM</text>
    <g fill="none" stroke="#526b86" stroke-width="2" marker-end="url(#arrow)">
      <path d="M204 181 H348"/><path d="M348 260 H204"/>
      <path d="M596 181 H748"/><path d="M748 260 H596"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="276" y="167">Brief / task</text>
      <text x="276" y="287">PM summary</text>
      <text x="672" y="167">PM assigns TASK</text>
      <text x="672" y="287">Members’ REPORTs</text>
    </g>
    <text x="28" y="365" font-size="19">ADMIN talks with PM; agents coordinate through TASK / REPORT files.</text>
    <text x="28" y="397" font-size="16" fill="#526b86">Team example: Team/Profile defines roles and routing; Core does not prescribe an organization.</text>
  </g>
</svg>
