<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Parallel tasks, explicit evidence convergence</title>
  <desc id="desc">Two sibling branch tasks belong to one root. Each follows its own ordered work, report and authorized review. Root archival checks current branch reports, matching family digest, convergence and separate archive authorization. This does not merge code.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#506781" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="390" rx="20" fill="#f2f6fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#152b43">
    <text x="30" y="45" font-size="28" font-weight="700">Parallel work. Ordered steps. Explicit closure.</text>
    <rect x="26" y="133" width="155" height="117" rx="12" fill="#152b43"/>
    <text x="103" y="178" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Root TASK</text>
    <text x="103" y="218" text-anchor="middle" font-size="18" fill="#ccdbe9">Shared objective</text>
    <path d="M183 178H207V133H237M183 208H207V245H237" fill="none" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="251" y="90" width="414" height="87" rx="10" fill="#e4edff" stroke="#c3d5f0"/>
    <text x="271" y="124" font-size="22" font-weight="700" fill="#214d94">Branch A</text>
    <text x="271" y="154" font-size="20">Work → Report → Review → Done</text>
    <rect x="251" y="202" width="414" height="87" rx="10" fill="#e4f3ee" stroke="#b9ddcf"/>
    <text x="271" y="236" font-size="22" font-weight="700" fill="#176448">Branch B</text>
    <text x="271" y="266" font-size="20">Work → Report → Review → Done</text>
    <path d="M667 133H690V178H713M667 245H690V208H713" fill="none" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="727" y="90" width="209" height="199" rx="12" fill="#fff" stroke="#a9bfd3"/>
    <text x="745" y="125" font-size="22" font-weight="700">Root closure</text>
    <text x="745" y="165" font-size="19">Current evidence</text>
    <text x="745" y="198" font-size="19">Convergence</text>
    <text x="745" y="231" font-size="19">Archive authority</text>
    <text x="745" y="268" font-size="17" fill="#506781">Checked at commit</text>
    <text x="30" y="338" font-size="20">Each Branch is a TASK linked by branch_of; the host schedules execution.</text>
    <text x="30" y="368" font-size="18" fill="#506781">Evidence convergence does not perform a Git merge or keep agents running.</text>
  </g>
</svg>
