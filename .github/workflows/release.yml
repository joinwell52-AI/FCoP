name: release

# Phase A only exercises dry-run. No tag push automatically uploads.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, publish-preflight]
        default: dry-run
        required: true
      accepted_head:
        type: string
        required: true
      candidate_content:
        type: string
        required: true
      artifact_run_id:
        type: string
        required: true
      candidate_manifest_sha256:
        type: string
        required: true
      gate_comment_id:
        description: "OWNER-signed structured Phase B authorization; never inferred from RC acceptance"
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify accepted artifacts and explicit publication authority
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wp4f-candidates-first-set
          path: artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify bytes, Gate, tag and protected environment; never build
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          HEAD: ${{ inputs.accepted_head }}
          CONTENT: ${{ inputs.candidate_content }}
          MANIFEST_SHA: ${{ inputs.candidate_manifest_sha256 }}
          COMMENT: ${{ inputs.gate_comment_id }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          python -c "import json,os; m=json.load(open('artifacts/candidate-manifest.json')); assert str(m['run_id'])==os.environ['RUN_ID']"
          python -B scripts/wp4f_release_guard.py artifacts --mode "$MODE" --head "$HEAD" --content "$CONTENT" --manifest-sha256 "$MANIFEST_SHA" --gate-comment "$COMMENT" | tee preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp4f-release-preflight
          path: preflight.json

  publish:
    name: Publish the same accepted bytes (Phase B only)
    needs: verify
    if: inputs.mode == 'publish-preflight' && needs.verify.outputs.authorized == 'true'
    environment: fcop-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wp4f-candidates-first-set
          path: artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Revalidate after ADMIN environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ inputs.accepted_head }}
          CONTENT: ${{ inputs.candidate_content }}
          MANIFEST_SHA: ${{ inputs.candidate_manifest_sha256 }}
          COMMENT: ${{ inputs.gate_comment_id }}
        run: |
          python -B scripts/wp4f_release_guard.py artifacts --mode publish-preflight --head "$HEAD" --content "$CONTENT" --manifest-sha256 "$MANIFEST_SHA" --gate-comment "$COMMENT"
      - name: Pinned upload tools, no rebuild
        run: python -m pip install twine==7.0.0 packaging==26.3
      - name: Upload fcop (no skip-existing)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_FCOP }}
        run: python -m twine upload artifacts/fcop-4.0.0-py3-none-any.whl artifacts/fcop-4.0.0.tar.gz
      - name: Upload fcop-mcp (no skip-existing)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_FCOP_MCP }}
        run: python -m twine upload artifacts/fcop_mcp-4.0.0-py3-none-any.whl artifacts/fcop_mcp-4.0.0.tar.gz
      - name: Verify all public PyPI bytes and fresh installed identity
        run: python -B scripts/wp4f_public_reinstall.py artifacts/candidate-manifest.json | tee public-reinstall.log
      - name: Create Stable Release, never infer or create its tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ inputs.accepted_head }}
          COMMENT: ${{ inputs.gate_comment_id }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          gh release create v4.0.0 --verify-tag --latest --title "FCoP 4.0.0" --notes "Accepted HEAD $HEAD; ADMIN authorization comment $COMMENT; artifact run $RUN_ID. Stable release 4.0.0; historical RC retained." artifacts/*.whl artifacts/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp4f-publication-evidence
          path: |
            public-reinstall.log
            artifacts/candidate-manifest.json
